name: Robô Trílogo
# Lê os chamados das duas contas do Trílogo e grava no FrotaHub.
#
# DUAS PORTAS, O MESMO CAMINHO
#   Agendado: de 2 em 2 horas, das 6h às 20h de Fortaleza, todos os dias, sempre
#             no modo `atualizacao`.
#   Na mão:   qualquer um dos três modos, quando o dono quiser.
#
#   As duas passadas pesadas NUNCA entram no agendamento: o levantamento relê a
#   base inteira e a cópia mexe em arquivo. São de botão, e de dono.
#
# MODOS
#   levantamento — lê TUDO desde 01/07/2026 e grava chamado, timeline, custos e a
#                  ficha de cada arquivo COM O TAMANHO, sem baixar nada. É a
#                  passada que responde "quantos GB isto vai custar?".
#   copia        — busca os bytes dos arquivos e manda para o R2.
#   atualizacao  — só o que mudou desde a última rodada concluída.
#   alvos        — lê SÓ os chamados cujos números você digitar no campo
#                  "Tickets", e mais nenhum. Sem janela de tempo: serve para
#                  buscar chamados antigos demais para qualquer janela — e para
#                  garantir que nenhuma linha de outro chamado seja gravada,
#                  porque o que não está na lista não chega a ser consultado.
on:
  # O cron do GitHub é em UTC, e Fortaleza é UTC−3. 6h daqui são 9h lá; 20h daqui
  # são 23h lá. Por sorte a janela inteira cabe no mesmo dia em UTC, então não
  # precisa mexer nos dias da semana — que é a pegadinha clássica deste campo.
  #
  #   6  8  10 12 14 16 18 20   (Fortaleza)
  #   9  11 13 15 17 19 21 23   (UTC)
  #
  # São 8 rodadas por dia, todos os dias. O repositório é público, então minuto
  # de Actions não é cobrado.
  schedule:
    - cron: "0 9,11,13,15,17,19,21,23 * * *"

  workflow_dispatch:
    inputs:
      modo:
        description: "O que fazer"
        required: true
        default: levantamento
        type: choice
        options: [levantamento, copia, atualizacao, alvos]
      tickets:
        description: "Só para o modo alvos: os números dos chamados (vírgula, espaço ou linha)"
        required: false
        default: ""
        type: string

# Duas rodadas ao mesmo tempo dariam trabalho repetido e log confuso.
#
# `cancel-in-progress: false` é escolha, não descuido: se o horário chegar com uma
# leitura ainda rodando, a nova ESPERA. Cancelar no meio deixaria a rodada aberta
# no banco, com a situação travada em "rodando" e ninguém para fechá-la.
concurrency:
  group: robo-trilogo
  cancel-in-progress: false

jobs:
  rodar:
    runs-on: ubuntu-latest
    # O levantamento leva minutos e a cópia pode levar horas. Mas a rodada
    # agendada é a incremental, que leva segundos — e uma incremental que passe
    # de meia hora está travada, não trabalhando. Sem este corte, uma rodada
    # pendurada seguraria a fila das próximas por quase seis horas.
    timeout-minutes: ${{ github.event_name == 'schedule' && 30 || 350 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          # O motor não tem dependência externa nenhuma, então não existe go.sum
          # para guardar em cache. Deixar ligado faria o passo falhar procurando
          # um arquivo que nunca vai existir.
          cache: false

      - name: Rodar
        working-directory: baleryan
        env:
          PAPEL: robo
          # Rodada agendada não tem `inputs`: cai no `atualizacao`.
          MODO: ${{ github.event.inputs.modo || 'atualizacao' }}
          CLIENTE_SLUG: frota-macedo

          # Só o modo `alvos` lê isto. Vazio nos outros — e vazio na rodada
          # agendada, que não tem `inputs`. Um número inválido aqui NÃO é
          # ignorado: o programa recusa subir, para não ler o chamado errado.
          TRILOGO_ALVOS: ${{ github.event.inputs.tickets }}

          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

          TRILOGO_EMAIL_INSTALACOES: ${{ secrets.TRILOGO_EMAIL_INSTALACOES }}
          TRILOGO_SENHA_INSTALACOES: ${{ secrets.TRILOGO_SENHA_INSTALACOES }}
          TRILOGO_EMAIL_CIVIL: ${{ secrets.TRILOGO_EMAIL_CIVIL }}
          TRILOGO_SENHA_CIVIL: ${{ secrets.TRILOGO_SENHA_CIVIL }}

          # Só a cópia precisa destes. No levantamento eles podem faltar.
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: go run ./cmd/robo
