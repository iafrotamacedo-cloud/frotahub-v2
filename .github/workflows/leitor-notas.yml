name: Leitor de notas

# POR QUE ISTO RODA AQUI E NÃO NO MOTOR
#
#   O motor roda num plano que adormece, e ler nota é trabalho de picos: fica
#   parado o dia inteiro e depois precisa de fôlego para oitenta arquivos de
#   uma vez. Aqui há tempo, disco e uma máquina limpa a cada corrida. O motor só
#   enfileira o trabalho; este robô lê a fila, faz o trabalho pesado e grava o
#   resultado. É o mesmo desenho do robô do Trílogo.
#
# O OCR SAIU EM 26/08/2026
#
#   O Tesseract achatava a página numa fita de texto onde a coluna
#   "quantidade" virava vizinha da coluna "valor unitário" — e a IA, recebendo
#   só a fita, tinha que adivinhar onde uma acabava e a outra começava.
#
#   Hoje o arquivo vai INTEIRO para o modelo, que enxerga a página com as
#   colunas no lugar. Por isso não há mais Tesseract, nem pdftoppm, nem
#   otimizador em Python aqui — dois minutos de instalação por corrida que não
#   serviam para nada.
#
#   Sobrou o `pdftotext`: o PDF que já traz camada de texto é lido de graça e
#   sem chamar a IA, e ali o texto é exato porque veio do arquivo.

on:
  schedule:
    # De 30 em 30 minutos, no horário comercial de Fortaleza (UTC−3).
    # 09:00–23:00 UTC = 06:00–20:00 aqui.
    - cron: "5,35 9-23 * * *"
  workflow_dispatch:

concurrency:
  group: leitor-notas
  cancel-in-progress: false

jobs:
  ler:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: baleryan/go.sum

      # A ÚNICA FERRAMENTA DE FORA QUE O ROBÔ AINDA CHAMA
      #
      #   Um em cada treze PDFs do contrato é digital. Mandá-lo para a IA seria
      #   trocar o texto exato do arquivo por uma leitura da imagem dele — e
      #   gastar cota para piorar. O robô confere isto ANTES de tomar o primeiro
      #   trabalho: sem o pdftotext ele para na hora, em vez de marcar as notas
      #   como "rodando" sem ninguém rodando.
      - name: Instalar o pdftotext
        run: sudo apt-get install -y poppler-utils

      - name: Ler as notas da fila
        working-directory: baleryan
        env:
          PAPEL: robo
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          # Sem esta chave o robô ainda roda, mas só lê XML e PDF com camada de
          # texto. Imagem, sem ela, não tem leitor nenhum — e o robô diz isso em
          # voz alta em vez de gravar uma nota vazia.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # O NOME DO MODELO MORA AQUI DE PROPÓSITO
          #
          #   O Google aposenta modelo sem avisar antes — avisa depois, na
          #   recusa. Em 26/08/2026 caíram o gemini-2.5-flash e o
          #   gemini-2.5-flash-lite no mesmo dia, os dois com a mensagem "no
          #   longer available to new users". E a cota gratuita é POR MODELO:
          #   trocar de modelo é trocar de balde.
          #
          #   Estando aqui, os dois casos se resolvem editando uma linha, sem
          #   subir código. Vazio faz valer o padrão do programa.
          GEMINI_MODELO: gemini-3.5-flash-lite
          # Segundos entre duas leituras. O limite do plano é por MINUTO, e
          # estourá-lo não devolve "espere", devolve erro. Vazio = 7 segundos.
          # O número real da sua conta está em aistudio.google.com/rate-limit.
          GEMINI_INTERVALO: ""
          # O robô do Trílogo exige as duas contas para subir; o leitor não as
          # usa, mas compartilha a mesma configuração.
          TRILOGO_EMAIL_INSTALACOES: ${{ secrets.TRILOGO_EMAIL_INSTALACOES }}
          TRILOGO_SENHA_INSTALACOES: ${{ secrets.TRILOGO_SENHA_INSTALACOES }}
          TRILOGO_EMAIL_CIVIL: ${{ secrets.TRILOGO_EMAIL_CIVIL }}
          TRILOGO_SENHA_CIVIL: ${{ secrets.TRILOGO_SENHA_CIVIL }}
        run: go run ./cmd/leitor
