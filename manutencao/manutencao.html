<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#A11F22">
<!-- A página de manutenção não pode ficar guardada no navegador: no dia em que
     o sistema voltar, quem já a viu continuaria vendo. -->
<meta http-equiv="cache-control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="pragma" content="no-cache">
<meta http-equiv="expires" content="0">
<title>FrotaHub — em manutenção</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  /* A fonte da marca é a mesma do sistema. Se o Google não responder — e uma
     página de manutenção é justamente a hora em que as coisas não respondem —
     a pilha de reserva segura o desenho sozinha. */
  :root{
    --vermelho:#A11F22;
    --vermelho-fundo:#7A1517;
    --claro:#FFFFFF;
    --claro-2:#F2DDDE;
    --claro-3:#E0B9BA;
    --f:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    --f-marca:"Montserrat",var(--f);
  }
  *{box-sizing:border-box}
  html,body{height:100%}

  /* TUDO É MEDIDO PELA ALTURA DA JANELA, NÃO PELA LARGURA
     A primeira versão crescia com `vw`: numa tela larga e BAIXA — que é o
     monitor de mesa com barra de favoritos, duas fileiras de abas e a barra do
     Windows — a marca ficava enorme e o conteúdo não cabia na vertical. Quem
     manda no tamanho aqui é a altura disponível.

     `safe center` é o par disso: sem ele, quando o conteúdo passa da janela, a
     centralização empurra o topo para fora e nem rolando se alcança. Foi assim
     que a marca apareceu cortada. */
  body{
    margin:0;
    font-family:var(--f);
    color:var(--claro);
    background:var(--vermelho);
    background-image:radial-gradient(120% 90% at 50% 24%, #B32629 0%, var(--vermelho) 42%, var(--vermelho-fundo) 100%);
    -webkit-font-smoothing:antialiased;
    display:flex;
    align-items:center;
    align-items:safe center;
    justify-content:center;
    overflow-y:auto;
    padding:clamp(16px,3.2vh,40px) 20px;
  }
  main{width:100%; max-width:640px; text-align:center}

  .marca{
    width:clamp(88px,16.5vh,184px);
    height:auto;
    display:block; margin:0 auto;
    filter:drop-shadow(0 10px 26px rgba(0,0,0,.26));
  }
  .nome{
    font-family:var(--f-marca);
    font-size:clamp(21px,4.3vh,37px);
    line-height:1; letter-spacing:-.015em;
    margin:clamp(10px,1.8vh,18px) 0 0;
  }
  .nome b{font-weight:800}
  .nome span{font-weight:400; color:var(--claro-2)}

  .risco{
    width:clamp(42px,5.6vh,70px); height:2px; border:0;
    background:rgba(255,255,255,.34);
    margin:clamp(13px,2.3vh,23px) auto;
  }

  h1{
    font-family:var(--f-marca);
    font-weight:600;
    font-size:clamp(16px,2.7vh,24px);
    line-height:1.2; letter-spacing:-.01em;
    margin:0;
  }
  .chamada{
    margin:clamp(13px,2.2vh,21px) 0 0;
    font-size:clamp(10px,1.35vh,12px);
    font-weight:500; letter-spacing:.16em; text-transform:uppercase;
    color:var(--claro-3);
  }

  /* O relógio ---------------------------------------------------------------
     Números tabulares: sem isso, cada segundo muda a largura do algarismo e a
     linha inteira treme. */
  .relogio{
    display:flex; justify-content:center; align-items:flex-start;
    gap:clamp(4px,1vh,12px);
    margin:clamp(6px,1vh,10px) 0 0;
  }
  .bloco{min-width:clamp(46px,8vh,82px)}
  .bloco strong{
    display:block;
    font-family:var(--f-marca); font-weight:800;
    font-variant-numeric:tabular-nums; font-feature-settings:"tnum" 1;
    font-size:clamp(29px,7.2vh,60px); line-height:1;
  }
  .bloco em{
    display:block; margin-top:6px; font-style:normal;
    font-size:clamp(9px,1.15vh,11px); font-weight:500;
    letter-spacing:.18em; text-transform:uppercase; color:var(--claro-3);
  }
  .doispontos{
    font-family:var(--f-marca); font-weight:600; color:rgba(255,255,255,.42);
    font-size:clamp(21px,4.8vh,40px); line-height:1.12;
  }

  /* O horário fica escrito por extenso e SEMPRE visível. Se o relógio não
     rodar — JavaScript desligado, navegador antigo, erro qualquer —, a
     informação que importa continua na tela. */
  .quando{
    margin:clamp(12px,2vh,20px) 0 0;
    font-size:clamp(12px,1.7vh,15px); color:var(--claro-2);
  }
  .quando b{font-weight:600; color:var(--claro)}

  .passou{display:none; margin:clamp(12px,2vh,20px) 0 0; font-size:clamp(12px,1.7vh,15px); color:var(--claro-2)}
  body.acabou .relogio,
  body.acabou .chamada{display:none}
  body.acabou .passou{display:block}

  .rodape{
    margin:clamp(18px,3.2vh,38px) 0 0;
    font-size:11px; color:rgba(255,255,255,.5);
  }

  /* Só para quem lê a tela em voz alta: o relógio piscando a cada segundo
     seria insuportável, então ele é mudo e esta frase é a que fala. */
  .so-leitor{
    position:absolute; width:1px; height:1px; padding:0; margin:-1px;
    overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; border:0;
  }

  main{animation:entrar .5s ease-out both}
  @keyframes entrar{from{opacity:0; transform:translateY(10px)} to{opacity:1; transform:none}}
  @media (prefers-reduced-motion:reduce){main{animation:none}}
</style>
</head>

<script>
  // O ALVO É UM INSTANTE FIXO, NÃO "HOJE AO MEIO-DIA"
  //
  //   Calcular "hoje" no navegador faria a página, às 12h01, começar a contar
  //   para o meio-dia de amanhã — e prometer 24 horas de manutenção a quem
  //   entrasse um minuto atrasado. Com o instante escrito, o fuso de quem
  //   acessa não importa: quem estiver em Portugal vê o mesmo tempo restante.
  var ALVO = new Date('2026-08-26T12:00:00-03:00').getTime();

  var h = document.getElementById('h'),
      m = document.getElementById('m'),
      s = document.getElementById('s');

  function doisDigitos(n){ return (n < 10 ? '0' : '') + n; }

  function pintar(){
    var falta = ALVO - Date.now();
    if (falta <= 0){
      document.body.className = 'acabou';
      return false;
    }
    var seg = Math.floor(falta / 1000);
    h.textContent = doisDigitos(Math.floor(seg / 3600));
    m.textContent = doisDigitos(Math.floor(seg / 60) % 60);
    s.textContent = doisDigitos(seg % 60);
    return true;
  }

  if (pintar()){
    var relogio = setInterval(function(){
      if (!pintar()) clearInterval(relogio);
    }, 1000);
    // Voltar de uma aba em segundo plano com o relógio parado no passado é a
    // forma mais fácil de a página mentir. Ao reaparecer, ela se acerta.
    document.addEventListener('visibilitychange', function(){
      if (!document.hidden) pintar();
    });
  }
</script>
